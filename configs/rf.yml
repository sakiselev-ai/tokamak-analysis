# Random Forest — baseline model (ADR-004)
model_type: random_forest
task: classification  # classification | disruption_prediction

hyperparameters:
  n_estimators: 200
  max_depth: 20
  min_samples_split: 5
  min_samples_leaf: 2
  class_weight: balanced
  max_features: sqrt
  random_state: 42
  n_jobs: -1

grid_search:
  n_estimators: [100, 200, 500, 1000]
  max_depth: [10, 20, 50, null]
  min_samples_split: [2, 5, 10]
  min_samples_leaf: [1, 2, 4]
  class_weight: [null, balanced, balanced_subsample]
  max_features: [sqrt, log2, 0.5]
