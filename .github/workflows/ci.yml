name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokamak
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: tokamak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint
        run: ruff check backend/

      - name: Test with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://tokamak:testpassword@localhost:5432/tokamak_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key
          ML_SERVICE_URL: http://localhost:8001
        run: pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing --cov-fail-under=80

  ml-service-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml_service/requirements.txt

      - name: Install dependencies
        run: pip install -r ml_service/requirements.txt

      - name: Lint
        run: ruff check ml_service/

      - name: Test with coverage
        run: pytest ml_service/tests/ -v --cov=ml_service/service --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        run: cd frontend && npm install

      - name: Build
        run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, ml-service-lint-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t tokamak-backend ./backend
      - name: Build ML service
        run: docker build -t tokamak-ml-service ./ml_service
      - name: Build frontend
        run: docker build -t tokamak-frontend ./frontend
