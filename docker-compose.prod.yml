# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.ssl.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./ssl/privkey.pem:/etc/ssl/private/privkey.pem:ro
    restart: unless-stopped

  backend:
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    restart: unless-stopped

  ml-service:
    restart: unless-stopped

  celery-worker:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
