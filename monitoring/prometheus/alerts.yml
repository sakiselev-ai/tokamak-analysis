groups:
  - name: tokamak_alerts
    rules:
      - alert: APIDown
        expr: up{job="backend"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend API is down"
          description: "Backend API has been unreachable for more than 5 minutes"

      - alert: MLServiceDown
        expr: up{job="ml-service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ML Service is down"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="backend"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (P99 > 100ms)"
          description: "P99 latency is {{ $value | humanizeDuration }}"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate (>5%)"

      - alert: DiskSpaceHigh
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 20%"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
